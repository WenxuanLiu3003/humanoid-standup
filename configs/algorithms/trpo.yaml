name: trpo

collection:
  num_envs: 1
  steps_per_env: 256

hyperparameters:
  total_timesteps: 50000
  rollout_steps: 256
  gamma: 0.99
  gae_lambda: 0.95
  normalize_advantages: true
  target_kl: 0.01
  cg_iters: 10
  cg_damping: 0.1
  backtrack_iters: 10
  backtrack_coeff: 0.8
  accept_ratio: 0.1
  vf_lr: 0.001
  vf_epochs: 10
  vf_minibatch_size: 64
  max_grad_norm: 0.5

network:
  hidden_sizes: [64, 64]
  initial_log_std: 0.0

normalization:
  normalize_observations: true
  observation_clip: 10.0
  epsilon: 0.00000001
  reward_scale: 0.01
  normalize_rewards: false
  reward_clip: 10.0

device: auto

logging:
  log_interval: 1
  checkpoint_interval: 0
